services:
  # Одноразовый: применяет миграции и завершается. Коллектор стартует после него.
  migrate:
    image: ghcr.io/dionis404/sfl-collector:latest
    pull_policy: always   # всегда свежий latest при деплое, а не закэшированный на сервере
    container_name: sfl-collector-migrate
    command: python -m collector.migrate
    restart: "no"
    environment:
      DB_HOST: ${DB_HOST:-postgres-main}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-sfl}
      DB_USER: ${DB_USER:-goblin}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - shared-net

  sfl-collector:
    image: ghcr.io/dionis404/sfl-collector:latest
    pull_policy: always   # всегда свежий latest при деплое, а не закэшированный на сервере
    container_name: sfl-collector
    command: python -m collector.main
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: ${DB_HOST:-postgres-main}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-sfl}
      DB_USER: ${DB_USER:-goblin}
      DB_PASSWORD: ${DB_PASSWORD}
      SFL_API_BASE: ${SFL_API_BASE:-https://api.sunflower-land.com}
      SFL_API_KEY: ${SFL_API_KEY}
      SFL_PROXY: ${SFL_PROXY:-}
      API_MIN_INTERVAL_SEC: ${API_MIN_INTERVAL_SEC:-10}
      TICKETS_ENABLED: ${TICKETS_ENABLED:-true}
      TICKETS_INTERVAL_SEC: ${TICKETS_INTERVAL_SEC:-3600}
      TICKETS_TRACK_FARMERS: ${TICKETS_TRACK_FARMERS:-true}
      TOP_FARMS_ENABLED: ${TOP_FARMS_ENABLED:-true}
      TOP_FARMS_INTERVAL_SEC: ${TOP_FARMS_INTERVAL_SEC:-3600}
      TOP_FARMS_N: ${TOP_FARMS_N:-100}
      MERCHANT_SOURCE_FARM_IDS: ${MERCHANT_SOURCE_FARM_IDS:-62559,1}
      ITEM_CHECKS_ENABLED: ${ITEM_CHECKS_ENABLED:-true}
      ITEM_CHECKS_TOP_N: ${ITEM_CHECKS_TOP_N:-200}
      ITEM_CHECKS_AUCTION_DELAYS_H: ${ITEM_CHECKS_AUCTION_DELAYS_H:-1,24}
      DUMP_ENABLED: ${DUMP_ENABLED:-true}
      DUMP_FILE_KIND: ${DUMP_FILE_KIND:-active}
      DUMP_TOP_N: ${DUMP_TOP_N:-500}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - shared-net
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # API для сайта: только читает БД. Порт наружу не публикуется —
  # сайт ходит по shared-net: http://sfl-collector-api:8000
  sfl-collector-api:
    image: ghcr.io/dionis404/sfl-collector:latest
    pull_policy: always   # всегда свежий latest при деплое, а не закэшированный на сервере
    container_name: sfl-collector-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: ${DB_HOST:-postgres-main}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-sfl}
      DB_USER: ${DB_USER:-goblin}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    networks:
      - shared-net

networks:
  shared-net:
    external: true
