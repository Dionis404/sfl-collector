name: Test, build and push to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']        # деплой-образ по тегу v0.1.0, v0.2.0 и т.д.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goblin
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sfl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goblin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          COLLECTOR_TEST_DB: "127.0.0.1:5432:sfl_test:goblin:test"

  build-and-push:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sfl-collector
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Автодеплой: дёргаем webhook стека в Portainer — он сам скачает новый образ
      # (pull_policy: always в compose) и пересоздаст контейнеры. Переменные стека,
      # заданные в UI Portainer, при этом сохраняются.
      # Секрет PORTAINER_WEBHOOK_URL: Portainer → Stacks → sfl-collector → GitOps updates →
      # Mechanism: Webhook → скопировать URL. Нет секрета — шаг пропускается.
      - name: Redeploy stack in Portainer
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: |
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST "$PORTAINER_WEBHOOK_URL")
          echo "Portainer webhook: HTTP $code"
          cat /tmp/resp || true
          test "$code" -ge 200 -a "$code" -lt 300
